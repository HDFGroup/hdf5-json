[flake8]
# mirrors the second flake8 invocation in .github/workflows/ci.yml, so a
# local run catches what CI would flag before it gets to a PR
max-line-length = 127
# F401: unused exports are necessary in __init__.py
# W503: line break before binary operator
# E203: whitespace before ':' (conflicts with black-style slice formatting)
ignore = F401, W503, E203
